Global:
  model_name: PP-OCRv6_tiny_rec_captcha_71
  debug: false
  use_gpu: true
  epoch_num: 60
  log_smooth_window: 20
  print_batch_step: 20
  save_model_dir: ./training/ppocrv6-captcha/output/full
  save_epoch_step: 1
  eval_batch_step: [0, 2000]
  cal_metric_during_train: true
  pretrained_model: ./training/ppocrv6-captcha/assets/PP-OCRv6_tiny_rec_pretrained.pdparams
  checkpoints:
  save_inference_dir:
  use_visualdl: true
  infer_img:
  character_dict_path: ./training/ppocrv6-captcha/charset.txt
  max_text_length: &max_text_length 12
  infer_mode: false
  use_space_char: false
  distributed: false
  seed: 20260728
  save_res_path: ./training/ppocrv6-captcha/output/predicts.txt
  d2s_train_image_shape: [3, 48, 320]

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0003
    warmup_epoch: 5
  regularizer:
    name: L2
    factor: 0.00003

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV4
    model_size: tiny
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: reshape
          Head:
            mid_channels: 80
            use_guide: true
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 384
          max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: MultiScaleDataSet
    ds_width: false
    data_dir: ./
    ext_op_transform_idx: 1
    label_file_list:
      - training/ppocrv6-captcha/data/train-balanced.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - RecConAug:
          prob: 0.5
          ext_data_num: 2
          image_shape: [48, 320, 3]
          max_text_length: *max_text_length
      - RecAug:
      - MultiLabelEncode:
          gtc_encode: NRTRLabelEncode
      - KeepKeys:
          keep_keys: [image, label_ctc, label_gtc, length, valid_ratio]
  sampler:
    name: MultiScaleSampler
    scales: [[320, 32], [320, 48], [320, 64]]
    first_bs: &batch_size 128
    fix_bs: false
    divided_factor: [8, 16]
    is_training: true
  loader:
    shuffle: true
    batch_size_per_card: *batch_size
    drop_last: true
    num_workers: 8

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./
    label_file_list:
      - training/ppocrv6-captcha/data/validation.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - MultiLabelEncode:
          gtc_encode: NRTRLabelEncode
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys: [image, label_ctc, label_gtc, length, valid_ratio]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 128
    num_workers: 4
