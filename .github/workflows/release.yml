name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Read release version
        id: metadata
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Install Chromium for extension tests
        run: npx playwright install --with-deps chromium

      - name: Run built-extension tests
        run: xvfb-run -a npm run test:e2e:extension

      - name: Build Chrome release ZIP
        run: npm run zip:chrome

      - name: Build Edge release ZIP
        run: npm run zip:edge

      - name: Prepare bilingual release notes
        run: npm run release:prepare -- "$GITHUB_REF_NAME"

      - name: Generate SHA-256 checksums
        working-directory: .output
        run: |
          sha256sum \
            "local-captcha-solver-${{ steps.metadata.outputs.version }}-chrome.zip" \
            "local-captcha-solver-${{ steps.metadata.outputs.version }}-edge.zip" \
            > SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          assets=(
            ".output/local-captcha-solver-${VERSION}-chrome.zip"
            ".output/local-captcha-solver-${VERSION}-edge.zip"
            ".output/SHA256SUMS.txt"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file .output/release-notes.md
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file .output/release-notes.md
          fi
